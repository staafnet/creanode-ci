name: CREANODE Security Gate

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Production Dockerfile path; leave empty to skip image scanning.
        required: false
        type: string
        default: ""
      docker_context:
        description: Docker build context.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  trivy-repository:
    name: Trivy Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load trusted CREANODE legacy baseline
        shell: bash
        env:
          BASELINE_URL: https://raw.githubusercontent.com/staafnet/creanode-ci/main/baselines/${{ github.event.repository.name }}.trivyignore.yaml
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/creanode-policy"
          if ! curl --fail --silent --show-error --location "$BASELINE_URL" -o "$RUNNER_TEMP/creanode-policy/trivyignore.yaml"; then
            printf 'vulnerabilities: []\nmisconfigurations: []\nsecrets: []\nlicenses: []\n' > "$RUNNER_TEMP/creanode-policy/trivyignore.yaml"
          fi

      - name: Security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          trivyignores: ${{ runner.temp }}/creanode-policy/trivyignore.yaml
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,misconfig,secret

      - name: License inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          scanners: license

  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check "semgrep==1.179.0"

      - name: Run Semgrep Community Edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            semgrep scan \
              --config p/security-audit \
              --config p/owasp-top-ten \
              --baseline-commit "$BASE_SHA" \
              --error \
              .
          else
            semgrep scan \
              --config p/security-audit \
              --config p/owasp-top-ten \
              --error \
              .
          fi

  trivy-image:
    name: Trivy Docker Image
    if: ${{ inputs.dockerfile != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.docker_context }}
        run: docker build --pull -f "$DOCKERFILE" -t "creanode-security-target:${{ github.sha }}" "$BUILD_CONTEXT"

      - name: Security gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: creanode-security-target:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret

      - name: License inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: creanode-security-target:${{ github.sha }}
          format: table
          exit-code: "0"
          scanners: license
